[project]
name = "alexa-mcp-server"
version = "0.1.0"
description = "NeuroCare — a cognitive substrate for Alexa+: an MCP server that gives neurodivergent people persistent memory, a sense of time, a translator for ambiguous messages, task breakdown, and guardrails against rumination and hyperfocus. Streamable HTTP, Amazon Developer Hackathon 2026 Alexa+ track."
readme = "README.md"
authors = [
    { name = "navinrc", email = "navinrc98@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
alexa-mcp-server = "alexa_mcp_server:main"
alexa-mcp-seed = "alexa_mcp_server.seed:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
